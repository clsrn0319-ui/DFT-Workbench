# RhoBench 리버스 프록시 — nginx 가 80/443 을 받아 내부 8000 으로 넘긴다.
#
#   sudo cp deploy/ncp/nginx-rhobench.conf /etc/nginx/sites-available/rhobench
#   sudo ln -sf /etc/nginx/sites-available/rhobench /etc/nginx/sites-enabled/rhobench
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 도메인이 있으면 server_name 을 바꾸고 certbot 으로 HTTPS 를 붙인다:
#   sudo certbot --nginx -d rhobench.example.com
# 도메인 없이 공인 IP 로만 쓰면 HTTP 이므로, ACG 에서 접속 허용 IP 를 반드시 제한한다
# (세션 쿠키가 평문으로 오간다).

server {
    listen 80;
    server_name _;            # 도메인이 있으면 rhobench.example.com 로

    client_max_body_size 50m; # 3D 구조 파일·xlsx 업로드

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 원본 로그 조회·큰 결과 응답이 길 수 있다
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }
}
